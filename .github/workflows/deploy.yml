name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v2.0
        with:
          # Netlify site ID (optional, can be omitted if using site name)
          # site_id: ${{ secrets.NETLIFY_SITE_ID }}
          # Netlify site name (required if site_id not set)
          site_name: ${{ secrets.NETLIFY_SITE_NAME }}
          # Directory to publish (output folder from Vite build)
          publish_dir: ./dist
          # Netlify personal access token with deploy rights
          auth_token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
