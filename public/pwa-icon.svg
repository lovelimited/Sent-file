<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />

  <!-- Background decorative glow circle -->
  <circle cx="256" cy="240" r="140" fill="url(#primary)" opacity="0.18" filter="url(#glow)" />

  <!-- Graduation Cap Icon & Base -->
  <g transform="translate(40, 20)">
    <!-- Tassel String and Ball -->
    <path d="M120 230 C 100 250, 95 310, 105 345" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" />
    <circle cx="106" cy="355" r="16" fill="url(#gold)" />

    <!-- Cap Top Diamond -->
    <polygon points="216,120 376,190 216,260 56,190" fill="url(#primary)" stroke="#60a5fa" stroke-width="6" />

    <!-- Cap Diamond Center Pin -->
    <circle cx="216" cy="190" r="14" fill="url(#gold)" />

    <!-- Cap Skull Headband -->
    <path d="M116 230 L 116 295 C 116 355, 316 355, 316 295 L 316 230" fill="#1e293b" stroke="url(#primary)" stroke-width="10" stroke-linejoin="round" />
  </g>

  <!-- School Work Hub Text or Badge Accent -->
  <rect x="146" y="405" width="220" height="42" rx="21" fill="#0f172a" stroke="#3b82f6" stroke-width="3" opacity="0.9" />
  <text x="256" y="432" fill="#93c5fd" font-size="20" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="2">
    WORK HUB
  </text>
</svg>
